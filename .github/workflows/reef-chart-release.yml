name: Reef chart - Release

# Triggered by the tag release.yml pushes, not by a commit on master. Everything this workflow
# needs is carried by the tag itself: the ref is the release commit, so the checkout already has
# the bumped Chart.yaml, and the tag name holds the version.
#
# This only fires because release-please pushes the tag with a PAT — see the token comment in
# release.yml.

on:
  push:
    tags:
      - reef-chart-v*

concurrency:
  group: reef-chart-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  HELM_VERSION: "v3.16.2"

# Every `run` step below executes inside the chart directory, since the chart is its own package
# rather than part of the server or the bundle.
defaults:
  run:
    working-directory: reef-chart

jobs:
  release:
    name: Package the chart
    runs-on: ubuntu-latest

    # Needs write access to GHCR to push the chart — cutting the release itself is still
    # release.yml's job, this one only packages and publishes.
    permissions:
      contents: read
      packages: write

    steps:
      # A tag push checks out the tagged commit, which is the release commit release-please
      # tagged — so Chart.yaml here is already the released version.
      - name: Check out the repository
        uses: actions/checkout@v4

      # Pinned to the version reef-chart-CI.yml lints with, so the chart is packaged by the same
      # Helm that passed the pull request.
      - name: Install Helm ${{ env.HELM_VERSION }}
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      # reef-chart-v1.2.3 -> 1.2.3. The tag is the single source of the version; there is no
      # output plumbing to keep in sync.
      - name: Derive the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#reef-chart-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package the chart
        run: helm package . --destination dist

      # The tag and Chart.yaml are two independent sources of the version, and helm package reads
      # only the second — so nothing else here would notice them disagreeing. The archive is named
      # after Chart.yaml's `name`, which is reef-server, while the tag prefix is reef-chart: the
      # chart is released on its own cadence but installs the server.
      - name: Check the package matches the tag
        run: |
          test -f "dist/reef-server-$VERSION.tgz"
          echo "CHART_PACKAGE=reef-chart/dist/reef-server-$VERSION.tgz" >> "$GITHUB_ENV"

      # Renders the packaged archive rather than the working tree, so the artifact a registry push
      # would take is the one proven to render. Minimal values only — exercising every value is the
      # pull request's job, this is the release's equivalent of the server image's smoke test.
      - name: Smoke-test the package
        run: helm template reef-server "dist/reef-server-$VERSION.tgz" --values ci/minimal-values.yaml

      - name: List the built artifact
        run: ls -l dist

      # OCI refs must be lowercase; github.repository_owner isn't guaranteed to be (ours is
      # "TKul6"), so this is the one thing that needs deriving rather than interpolating directly.
      - name: Derive the chart registry
        run: |
          echo "CHART_REGISTRY=oci://ghcr.io/tkul6/reef-charts" >> "$GITHUB_ENV"

      # GITHUB_TOKEN is enough to push packages to this repository's own GHCR namespace — no extra
      # secret to configure, unlike the Docker Hub beta push which is a different registry.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      # Lands at oci://ghcr.io/<owner>/reef-charts/reef-server:<version> — the chart name comes
      # from Chart.yaml, Helm appends it to CHART_REGISTRY on push. That full path, not just
      # CHART_REGISTRY, is what gets registered as the repository on ArtifactHub.
      - name: Push the chart to GHCR
        run: helm push "dist/reef-server-$VERSION.tgz" "$CHART_REGISTRY"

      - name: Report what was released
        run: |
          echo "Released $GITHUB_REF_NAME, built $CHART_PACKAGE and pushed it to $CHART_REGISTRY/reef-server:$VERSION." >> "$GITHUB_STEP_SUMMARY"
