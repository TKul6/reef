name: Reef server - Publish pre-release

on:
  pull_request:
    branches: [master]
    paths:
      - reef-server/**

  workflow_dispatch:

env:
  IMAGE_NAME: reef-server
  PYTHON_VERSION: "3.12"

# Every `run` step below executes inside the package directory, since the server is its own
# Poetry project rather than part of the repository root.
defaults:
  run:
    working-directory: reef-server

jobs:
  publish:
    name: Test, build and push a beta image
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The runner is not assumed to ship with a usable Python, so install the one
      # the Dockerfile is built on.
      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install --no-cache-dir poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest

      # pyproject.toml supplies the base version and the PR number makes each push unique:
      # 1.0.0 becomes 1.0.0-beta-42. Nothing is committed, so master still reads 1.0.0 and the
      # version field stays release-please's alone.
      - name: Stamp the beta version
        run: |
          VERSION="$(poetry version --short)-beta-${{ github.run_number }}"
          echo "IMAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build the Reef server beta image
        run: |
          docker build \
            --file Dockerfile \
            --build-arg REEF_SERVER_VERSION="${IMAGE_VERSION}" \
            --tag "${IMAGE_NAME}:${IMAGE_VERSION}" \
            .

      - name: List the built tags
        run: docker images "${IMAGE_NAME}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag the image for Docker Hub
        run: docker tag "${IMAGE_NAME}:${IMAGE_VERSION}" "${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${IMAGE_VERSION}"

      - name: Push the beta image to Docker Hub
        run: docker push "${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${IMAGE_VERSION}"

      - name: Report what was published
        run: |
          echo "Published ${IMAGE_NAME}:${IMAGE_VERSION} to Docker Hub." >> "$GITHUB_STEP_SUMMARY"
