name: Reef server - Release

# Triggered by the tag release.yml pushes, not by a commit on master. Everything this workflow
# needs is carried by the tag itself: the ref is the release commit, so the checkout already has
# the bumped pyproject.toml, and the tag name holds the version. Nothing is threaded in from the
# release job.
#
# This only fires because release-please pushes the tag with a PAT — see the token comment in
# release.yml.

on:
  push:
    tags:
      - reef-server-v*

concurrency:
  group: reef-server-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-image:
    name: Build and smoke-test the release image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: reef-server

    steps:
      # A tag push checks out the tagged commit, which is the release commit release-please
      # tagged — so pyproject.toml here is already the released version.
      - name: Check out the repository
        uses: actions/checkout@v4

      # reef-server-v1.2.3 -> 1.2.3. The tag is the single source of the version; there is no
      # output plumbing to keep in sync.
      - name: Derive the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#reef-server-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=reef-server:$VERSION" >> "$GITHUB_ENV"

      # The version is baked in, so the released image reports itself correctly with no
      # REEF_SERVER_VERSION in the deployment.
      - name: Build the release image
        run: |
          docker build \
            --file Dockerfile \
            --build-arg REEF_SERVER_VERSION="$VERSION" \
            --tag "$IMAGE" \
            .

      # Proves the image starts and that the version really was baked in. DAGS_VERSION is
      # supplied because /information reports it; /ready is deliberately not checked, since the
      # base image holds no dags.tar.gz and answering 503 is the correct behaviour there.
      - name: Smoke-test the image
        run: |
          docker run -d --name reef-smoke -e DAGS_VERSION=0.0.0-smoke -p 8080:8080 "$IMAGE"
          for _ in $(seq 30); do curl -fsS localhost:8080/api/v1/health && break; sleep 1; done
          curl -fsS localhost:8080/api/v1/health | grep -q '"healthy":true'
          curl -fsS localhost:8080/api/v1/information | grep -q "\"serverVersion\":\"$VERSION\""

      - name: Stop the container
        if: always()
        run: docker rm -f reef-smoke || true

      - name: Report what was released
        run: |
          echo "Released $GITHUB_REF_NAME and built $IMAGE." >> "$GITHUB_STEP_SUMMARY"
        