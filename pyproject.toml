[tool.poetry]
name = "reef"
version = "1.0.0"
description = "A lightweight API that serves Airflow DAG bundles on top of Rest API."
authors = ["TKul6 <TKul6@github.com>"]
readme = "docs/README.md"
packages = [{include = "reef"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.115"
uvicorn = {version = ">=0.34", extras = ["standard"]}

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.0"
pytest = "^8.0"
httpx = ">=0.27"

[tool.poetry.scripts]
reef-server = "reef.server:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["reef/tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 150
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
]
ignore = []

extend-select = [
    # indentation
    "E111", # indentation is not a multiple of four
    "E117", # over-indented

    # whitespace around brackets and punctuation
    "E201", # whitespace after '('
    "E202", # whitespace before ')'
    "E203", # whitespace before ':'
    "E211", # whitespace before '('
    "E231", # missing whitespace after ','
    "E241", # multiple spaces after ','
    "E242", # tab after ','
    "E251", # unexpected spaces around keyword / parameter equals

    # whitespace around operators
    "E221", # multiple spaces before operator
    "E222", # multiple spaces after operator
    "E223", # tab before operator
    "E224", # tab after operator
    "E225", # missing whitespace around operator
    "E226", # missing whitespace around arithmetic operator
    "E227", # missing whitespace around bitwise or shift operator
    "E228", # missing whitespace around modulo operator

    # whitespace around keywords
    "E271", # multiple spaces after keyword
    "E272", # multiple spaces before keyword
    "E273", # tab after keyword
    "E274", # tab before keyword
    "E275", # missing whitespace after keyword

    # comment formatting
    "E261", # at least two spaces before inline comment
    "E262", # inline comment should start with '# '
    "E265", # block comment should start with '# '
    "E266", # too many leading '#' for block comment

    # blank lines
    "E301", # expected 1 blank line, found 0
    "E302", # expected 2 blank lines, found 0
    "E303", # too many blank lines
    "E304", # blank lines found after function decorator
    "E305", # expected 2 blank lines after end of function or class
    "E306", # expected 1 blank line before a nested definition
]
