{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reef-server.serviceAccountName" . }}
  labels:
    {{- include "reef-server.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Reef never calls the Kubernetes API, so its pods have no use for a mounted token.
automountServiceAccountToken: false
{{- end }}
